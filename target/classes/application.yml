spring:
  application:
    name: samaki-farm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:samakiFarm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway ndiyo inayosimamia schema, si Hibernate auto-generate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: true   # UI ya kujaribu GraphQL - zima kwenye production (weka false)
    schema:
      printer:
        enabled: true

server:
  port: ${PORT:8082}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:badilisha-hii-na-siri-ndefu-sana-kabla-ya-production}
    expiration-hours: 12
  data:
    initialize: ${APP_DATA_INITIALIZE:true}
  permissions:
    csv:
      path: ${APP_PERMISSIONS_CSV:seed/permissions.csv}
  role-permissions:
    csv:
      path: ${APP_ROLE_PERMISSIONS_CSV:seed/role_permissions.csv}
  root:
    name: ${ROOT_NAME:System Root}
    phone: ${ROOT_PHONE:0000000000}
    email: ${ROOT_EMAIL:root@system.com}
    password: ${ROOT_PASSWORD:Root@123}
