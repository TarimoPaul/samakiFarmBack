spring:
  application:
    name: samaki-farm-backend

  # Inapakia `.env` ya mzizi wa project (haiingii kwenye git) kama chanzo cha
  # properties, hivyo ${JWT_SECRET} na wenzake wanapatikana bila kuweka
  # environment variables kwa mkono kila mara.
  #
  # Bila mstari huu, `mvn spring-boot:run` au kubonyeza Run kwenye IDE
  # kunashindwa kuanza:
  #     Could not resolve placeholder 'JWT_SECRET' in value "${JWT_SECRET}"
  # - Spring HAISOMI `.env` yenyewe, ilhali .env.example ilikuwa ikiahidi
  # kwamba kunakili faili hiyo kunatosha.
  #
  # `optional:` - app inaanza bila `.env` kabisa (ndivyo production
  # inavyofanya kazi: environment variables halisi).
  # `[.properties]` - inaeleza Spring jinsi ya kusoma faili isiyo na kiendelezi.
  #
  # Environment variables HALISI zina kipaumbele zaidi ya faili hii, hivyo
  # deploy inaweza kuzibadilisha bila kugusa `.env`.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:samakiFarm}
    username: ${DB_USER:postgres}
    # HAKUNA default (B8): siri haipaswi kuwa ndani ya repo.
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway ndiyo inayosimamia schema, si Hibernate auto-generate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Zote mbili ni zana za MAENDELEO zinazofichua muundo wa API: graphiql ni
  # console ya kutuma query, na schema printer inachapisha schema nzima.
  # Awali zilikuwa `true` hapa zikiwa na maoni tu yakisema "zima kwenye
  # production" - hakuna kilichokuwa kikilazimisha hilo (angalia
  # FRONTEND_BACKEND_AUDIT.md, D-11).
  #
  # Sasa zimezimwa kwa chaguo-msingi na zinawashwa na profile ya `dev`
  # PEKEE (angalia application-dev.yml). Chaguo-msingi salama ni muhimu
  # zaidi kuliko urahisi: deploy iliyosahau kuweka profile inapata hali
  # iliyofungwa, si iliyo wazi.
  #
  # Kwa maendeleo:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
  graphql:
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: false

server:
  port: ${PORT:8082}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # HAKUNA default (B8): secret ya awali iliyokuwa hapa ilikuwa ndani ya
    # repo, hivyo mtu yeyote aliyeisoma angeweza kutengeneza token halali.
    secret: ${JWT_SECRET}
    expiration-hours: 12
  data:
    initialize: ${APP_DATA_INITIALIZE:true}
  permissions:
    csv:
      path: ${APP_PERMISSIONS_CSV:seed/permissions.csv}
  role-permissions:
    csv:
      path: ${APP_ROLE_PERMISSIONS_CSV:seed/role_permissions.csv}
  # ---------- Vikumbusho (Reminders scheduler) ----------
  # Zote zinabadilishwa kwa environment variable bila kujenga upya:
  # mfumo unaotuma SMS kwa watu halisi lazima uweze kuzimwa au
  # kupunguzwa haraka kutoka kwenye mazingira, si kwa deploy mpya.
  reminders:
    # false = bean ya ReminderScheduler haitengenezwi kabisa (hakuna tiki).
    enabled: ${REMINDERS_ENABLED:true}
    # Saa 1 asubuhi / saa 6 mchana / saa 11 jioni - baada ya kila kazi ya
    # kiolezo (07:00, 08:00, 17:00) kuiva. Kikumbusho kinachotangulia saa
    # ya kazi ni kero, si kikumbusho.
    cron: "${REMINDERS_CRON:0 0 7,12,17 * * *}"
    # DODOMA NI EAT (UTC+3). Server ya production kwa kawaida iko UTC,
    # hivyo bila kanda hii "saa 1 asubuhi" ingekuwa saa 10 alfajiri.
    zone: ${REMINDERS_ZONE:Africa/Nairobi}
    # Saa za kimya - dirisha linaruhusiwa kuvuka usiku wa manane.
    # Kuziweka SAWA (mfano zote 00:00) kunazizima kabisa.
    quiet-start: ${REMINDERS_QUIET_START:21:00}
    quiet-end: ${REMINDERS_QUIET_END:06:00}
    # Swichi kwa kila njia. Mpokeaji mwenye simu NA push_token anapata
    # zote mbili - si mbadala (angalia ReminderDispatchService).
    sms-enabled: ${REMINDERS_SMS_ENABLED:true}
    push-enabled: ${REMINDERS_PUSH_ENABLED:true}
  root:
    # ROOT_PHONE/ROOT_PASSWORD zisipowekwa, ROOT HATENGENEZWI kabisa
    # (angalia RbacSeedService.seedRootUser) - si kosa la kuanzisha app,
    # ni onyo kwenye logs.
    name: ${ROOT_NAME:System Root}
    phone: ${ROOT_PHONE:}
    email: ${ROOT_EMAIL:}
    password: ${ROOT_PASSWORD:}
    # Swichi ya dharura: ROOT_PASSWORD_RESET=true inarudisha password ya
    # ROOT ALIYEPO kuwa ROOT_PASSWORD, na kumlazimisha aibadilishe.
    # Ni ya MARA MOJA - iondoe baada ya kuitumia (angalia
    # RbacSeedService.seedRootUser). Default ni false, hivyo restart ya
    # kawaida haiwezi kufuta password ya ROOT kimyakimya.
    password-reset: ${ROOT_PASSWORD_RESET:false}
