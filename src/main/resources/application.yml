spring:
  application:
    name: samaki-farm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:samakiFarm}
    username: ${DB_USER:postgres}
    # HAKUNA default (B8): siri haipaswi kuwa ndani ya repo.
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway ndiyo inayosimamia schema, si Hibernate auto-generate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: true   # UI ya kujaribu GraphQL - zima kwenye production (weka false)
    schema:
      printer:
        enabled: true

server:
  port: ${PORT:8082}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # HAKUNA default (B8): secret ya awali iliyokuwa hapa ilikuwa ndani ya
    # repo, hivyo mtu yeyote aliyeisoma angeweza kutengeneza token halali.
    secret: ${JWT_SECRET}
    expiration-hours: 12
  data:
    initialize: ${APP_DATA_INITIALIZE:true}
  permissions:
    csv:
      path: ${APP_PERMISSIONS_CSV:seed/permissions.csv}
  role-permissions:
    csv:
      path: ${APP_ROLE_PERMISSIONS_CSV:seed/role_permissions.csv}
  root:
    # ROOT_PHONE/ROOT_PASSWORD zisipowekwa, ROOT HATENGENEZWI kabisa
    # (angalia RbacSeedService.seedRootUser) - si kosa la kuanzisha app,
    # ni onyo kwenye logs.
    name: ${ROOT_NAME:System Root}
    phone: ${ROOT_PHONE:}
    email: ${ROOT_EMAIL:}
    password: ${ROOT_PASSWORD:}
    # Swichi ya dharura: ROOT_PASSWORD_RESET=true inarudisha password ya
    # ROOT ALIYEPO kuwa ROOT_PASSWORD, na kumlazimisha aibadilishe.
    # Ni ya MARA MOJA - iondoe baada ya kuitumia (angalia
    # RbacSeedService.seedRootUser). Default ni false, hivyo restart ya
    # kawaida haiwezi kufuta password ya ROOT kimyakimya.
    password-reset: ${ROOT_PASSWORD_RESET:false}
